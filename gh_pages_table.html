<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>양품화 소테이블</title>
<style>
  :root { --ink:#0f172a; --ink-2:#334155; --ink-3:#64748b; --ink-mute:#94a3b8; --surface:#f8fafc; --card:#ffffff; --ring:#e2e8f0; --blue:#3b82f6; --blue-soft:rgba(59,130,246,0.08); --green:#22c55e; --green-soft:rgba(34,197,94,0.10); --orange:#f97316; --orange-soft:rgba(249,115,22,0.10); --shadow:0 1px 3px rgba(15,23,42,0.06),0 4px 12px rgba(15,23,42,0.03); --r:10px; --r-lg:14px; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; background:var(--surface); color:var(--ink); min-height:100vh; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; font-size:15px; }
  header { background:var(--ink); color:#fff; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:50; }
  header .title { font-size:15px; font-weight:700; }
  header .sub-id { background:var(--blue); padding:4px 12px; border-radius:6px; font-size:13px; font-weight:700; }
  .container { flex:1; max-width:420px; margin:0 auto; padding:16px; width:100%; }
  .status-dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; }
  .status-dot.live { background:var(--green); animation:pulse 1.5s infinite; }
  .status-dot.off { background:#94a3b8; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
  .status-text { font-size:10px; color:rgba(255,255,255,0.5); }
  .waiting { text-align:center; padding:48px 16px; }
  .waiting-title { font-size:18px; font-weight:700; margin-bottom:6px; }
  .waiting-desc { font-size:13px; color:var(--ink-mute); line-height:1.5; }
  .card { background:var(--card); border-radius:var(--r-lg); box-shadow:var(--shadow); overflow:hidden; }
  .card-color-bar { height:6px; }
  .card-color-bar.c-white { background:var(--ring); }
  .card-color-bar.c-green { background:var(--green); }
  .card-color-bar.c-orange { background:var(--orange); }
  .card-body { padding:16px; }
  .card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:10px; }
  .card-sku { font-size:20px; font-weight:800; letter-spacing:-0.02em; margin-bottom:2px; }
  .card-option { font-size:13px; color:var(--ink-3); }
  .card-cat { display:inline-block; font-size:10px; background:var(--blue-soft); color:var(--blue); padding:2px 8px; border-radius:4px; margin-bottom:10px; font-weight:600; }
  .btn-photo { flex-shrink:0; background:var(--blue); color:#fff; text-decoration:none; font-size:13px; font-weight:600; padding:8px 14px; border-radius:6px; }
  .btn-photo.disabled { opacity:0.25; pointer-events:none; }
  .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
  .info-box { background:var(--surface); border-radius:var(--r); padding:12px; text-align:center; }
  .info-label { font-size:10px; color:var(--ink-mute); margin-bottom:2px; font-weight:500; text-transform:uppercase; letter-spacing:0.03em; }
  .info-value { font-size:22px; font-weight:800; }
  .bag-color-block { border-radius:var(--r); padding:14px; text-align:center; margin-bottom:14px; }
  .bag-color-block.c-white { background:var(--card); border:1px solid var(--ring); color:var(--ink-2); }
  .bag-color-block.c-green { background:var(--green); color:#fff; }
  .bag-color-block.c-orange { background:var(--orange); color:#fff; }
  .bag-color-name { font-size:18px; font-weight:700; }
  .bag-color-sub { font-size:12px; opacity:0.7; }
  .scan-time { text-align:center; font-size:11px; color:var(--ink-mute); margin-top:10px; }
  .t-poly-btn { flex:1; padding:9px; border:1px solid var(--ring); border-radius:var(--r); background:var(--card); font-size:13px; font-weight:600; color:var(--ink-3); cursor:pointer; text-align:center; }
  .t-poly-btn.active { border-color:var(--blue); background:var(--blue-soft); color:var(--blue); }
  .t-done-banner { background:var(--green-soft); color:#15803d; border-radius:var(--r); padding:12px; text-align:center; font-size:15px; font-weight:700; margin-top:10px; }
</style>
</head>
<body>

<header>
  <div>
    <div class="title">양품화</div>
    <div style="display:flex; align-items:center; margin-top:4px;">
      <span class="status-dot live" id="statusDot"></span>
      <span class="status-text" id="statusText">실시간 연결 중</span>
    </div>
  </div>
  <div style="display:flex; align-items:center; gap:8px;">
    <button onclick="forceRefresh()" style="background:none; border:none; color:rgba(255,255,255,0.5); font-size:12px; font-weight:600; cursor:pointer;">새로고침</button>
    <div class="sub-id" id="subBadge">-</div>
  </div>
</header>

<div class="container">
  <div id="waitingView" class="waiting">
    
    <div class="waiting-title">대기 중</div>
    <div class="waiting-desc">스캔 담당자가 상품을 스캔하면<br>여기에 자동으로 표시됩니다</div>
  </div>

  <div id="infoView" style="display:none;">
    <div class="card">
      <div class="card-color-bar" id="colorBar"></div>
      <div class="card-body">
        <div class="card-top">
          <div>
            <div class="card-sku" id="tSku">-</div>
            <div class="card-option" id="tOption">-</div>
          </div>
          <a href="#" id="tPhotoLink" class="btn-photo" target="_blank">상품확인</a>
        </div>
        <div id="tCatWrap"></div>

        <div class="bag-color-block" id="tBagBlock">
          <div class="bag-color-name" id="tBagName">-</div>
          <div class="bag-color-sub" id="tBagSub">-</div>
        </div>

        <div class="info-grid">
          <div class="info-box">
            <div class="info-label">폴리 규격</div>
            <div class="info-value" id="tPoly">-</div>
          </div>
          <div class="info-box">
            <div class="info-label" id="tPcsLabel">대봉당 pcs</div>
            <div class="info-value" id="tPcs">-</div>
          </div>
        </div>

        <div class="info-grid">
          <div class="info-box">
            <div class="info-label">로케이션</div>
            <div class="info-value" style="font-size:16px;" id="tLoc">-</div>
          </div>
          <div class="info-box">
            <div class="info-label">단수</div>
            <div class="info-value" id="tTier">-</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 신규 입력 영역 (폴리/pcs 없을 때) -->
    <div id="tNewInput" style="display:none; margin-top:12px;">
      <div style="background:#fff3cd; border-radius:10px; padding:10px 14px; font-size:13px; color:#856404; margin-bottom:12px;">
        등록된 값이 없습니다. 직접 입력해주세요.
      </div>
      <div style="display:flex; gap:6px; margin-bottom:10px;">
        <button class="t-poly-btn" data-size="1호" onclick="selectTPoly(this)">1호</button>
        <button class="t-poly-btn" data-size="2호" onclick="selectTPoly(this)">2호</button>
        <button class="t-poly-btn" data-size="3호" onclick="selectTPoly(this)">3호</button>
        <button class="t-poly-btn" data-size="4호" onclick="selectTPoly(this)">4호</button>
      </div>
      <div style="display:flex; gap:8px; align-items:center; margin-bottom:12px;">
        <button onclick="adjTPcs(-1)" style="width:40px; height:40px; border:1.5px solid #e2e2e6; border-radius:8px; background:#fff; font-size:18px; cursor:pointer;">－</button>
        <input type="number" id="tPcsInput" placeholder="대봉당 pcs" style="flex:1; padding:10px; border:1.5px solid #e2e2e6; border-radius:8px; font-size:16px; text-align:center;">
        <button onclick="adjTPcs(1)" style="width:40px; height:40px; border:1.5px solid #e2e2e6; border-radius:8px; background:#fff; font-size:18px; cursor:pointer;">＋</button>
      </div>
      <button onclick="submitNewFromTable()" style="width:100%; padding:12px; background:#2563eb; color:#fff; border:none; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer;">신규 값 등록</button>
    </div>

    <!-- 완료/취소 버튼 -->
    <div id="tActionArea" style="margin-top:12px;">
      <button id="tCompleteBtn" onclick="completeWork()" style="width:100%; padding:14px; background:#22c55e; color:#fff; border:none; border-radius:12px; font-size:16px; font-weight:700; cursor:pointer; display:none;">양품화 완료</button>
      <button id="tUndoBtn" onclick="undoComplete()" style="width:100%; padding:12px; margin-top:8px; background:#fff; color:#b91c1c; border:1.5px solid #b91c1c; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; display:none;">완료 취소</button>
    </div>

    <div class="scan-time" id="tTime">-</div>
  </div>
</div>

<script>
// ★ Supabase 설정
const SUPABASE_URL = 'https://zscvnuwlhkbehmnfcsid.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpzY3ZudXdsaGtiZWhtbmZjc2lkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0ODczMTMsImV4cCI6MjEwMTA2MzMxM30.74_Ftpek4somkdq4iGrbExVx8o2EUVLSk61qp8fj1qM';

// ★ 상품확인 URL — 비면 버튼 비활성
const PHOTO_SEARCH_BASE_URL = 'https://admin.a-bly.com/mobile/goods';

// URL 파라미터에서 소테이블 ID 추출 (?t=3층-1-3)
const params = new URLSearchParams(window.location.search);
const subTable = params.get('t');
let lastScanTime = '';

if (subTable) {
  document.getElementById('subBadge').textContent = subTable;
  startPolling();
} else {
  document.getElementById('waitingView').innerHTML =
    '' +
    '<div class="waiting-title">소테이블 미지정</div>' +
    '<div class="waiting-desc">QR코드를 통해 접속해주세요</div>';
}

function startPolling() {
  fetchInfo();
  setInterval(fetchInfo, 5000);
}

function forceRefresh() {
  lastScanTime = '';
  fetchInfo();
}

async function fetchInfo() {
  try {
    const url = `${SUPABASE_URL}/rest/v1/current_work?sub_table=eq.${encodeURIComponent(subTable)}&select=*&limit=1`;
    const resp = await fetch(url, {
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
      }
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const rows = await resp.json();
    document.getElementById('statusDot').className = 'status-dot live';
    document.getElementById('statusText').textContent = '실시간 연결 중';

    if (!rows.length || !rows[0].sku) {
      document.getElementById('waitingView').style.display = '';
      document.getElementById('infoView').style.display = 'none';
      return;
    }
    renderInfo(rows[0]);
  } catch (e) {
    console.error('조회 실패:', e);
    document.getElementById('statusDot').className = 'status-dot off';
    document.getElementById('statusText').textContent = '연결 끊김';
  }
}

function renderInfo(data) {
  const scanTime = data.scanned_at || '';
  if (scanTime === lastScanTime) return;
  lastScanTime = scanTime;

  document.getElementById('waitingView').style.display = 'none';
  document.getElementById('infoView').style.display = '';

  document.getElementById('tSku').textContent = data.sku || '-';
  document.getElementById('tOption').textContent = (data.option_name || '') + ' · ' + (data.product_name || '');

  // 상품확인
  const photoLink = document.getElementById('tPhotoLink');
  if (PHOTO_SEARCH_BASE_URL && data.sku) {
    photoLink.href = PHOTO_SEARCH_BASE_URL + '?keyword_type=sku_code&keyword=' + encodeURIComponent(data.sku);
    photoLink.classList.remove('disabled');
  } else {
    photoLink.href = '#';
    photoLink.classList.add('disabled');
  }

  // 카테고리
  const catWrap = document.getElementById('tCatWrap');
  catWrap.innerHTML = data.category_small ? '<span class="card-cat">' + data.category_small + '</span>' : '';

  // 대봉 색상
  const bagColor = data.bag_color || '투명';
  const colorClass = bagColor === '초록' ? 'c-green' : bagColor === '주황' ? 'c-orange' : 'c-white';
  document.getElementById('colorBar').className = 'card-color-bar ' + colorClass;
  document.getElementById('tBagBlock').className = 'bag-color-block ' + colorClass;
  document.getElementById('tBagName').textContent = bagColor + ' 대봉';
  document.getElementById('tBagSub').textContent = data.tier ? data.tier + '단' : '-';

  document.getElementById('tPoly').textContent = data.poly || '-';
  document.getElementById('tPcs').textContent = data.pcs != null ? data.pcs : '-';
  document.getElementById('tPcsLabel').textContent = data.tier ? '대봉당 pcs (' + data.tier + '단)' : '대봉당 pcs';
  document.getElementById('tLoc').textContent = data.location_code || '-';
  document.getElementById('tTier').textContent = data.tier ? data.tier + '단' : '-';

  // 시간 포맷
  let timeStr = '-';
  if (scanTime) {
    try { timeStr = new Date(scanTime).toLocaleString('ko-KR', { hour:'2-digit', minute:'2-digit', second:'2-digit' }); } catch(e) { timeStr = scanTime; }
  }
  document.getElementById('tTime').textContent = '스캔 시각: ' + timeStr;

  // 완료/신규 상태 표시
  currentData = data;
  isCompleted = false;
  const hasPoly = !!data.poly;
  const hasPcs = data.pcs != null;
  const needsInput = !hasPoly && !hasPcs;

  document.getElementById('tNewInput').style.display = needsInput ? '' : 'none';
  document.getElementById('tCompleteBtn').style.display = (!needsInput && !isCompleted) ? '' : 'none';
  document.getElementById('tUndoBtn').style.display = 'none';

  // 신규 입력 초기화
  tSelectedPoly = null;
  document.querySelectorAll('.t-poly-btn').forEach(b => b.classList.remove('active'));
  const pcsInput = document.getElementById('tPcsInput');
  if (pcsInput) pcsInput.value = '';
}

// ===== 소테이블 완료/신규/취소 =====
let currentData = null;
let isCompleted = false;
let prevData = null; // 취소용 백업
let tSelectedPoly = null;

function selectTPoly(btn) {
  document.querySelectorAll('.t-poly-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  tSelectedPoly = btn.dataset.size;
}

function adjTPcs(delta) {
  const input = document.getElementById('tPcsInput');
  const cur = parseInt(input.value) || 0;
  input.value = Math.max(0, cur + delta);
}

async function sbPost(path, body) {
  const resp = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation,resolution=merge-duplicates'
    },
    body: JSON.stringify(body)
  });
  if (!resp.ok) throw new Error('저장 실패: ' + resp.status);
  return resp.json();
}

// 3단↔4단 변환
function convertPcs(pcs, fromTier) {
  if (!pcs || pcs <= 0) return null;
  const raw = fromTier === 4 ? pcs * 515 / 380 : pcs * 380 / 515;
  return pcs < 15 ? Math.floor(raw) : Math.floor(raw / 5) * 5;
}

async function submitNewFromTable() {
  if (!tSelectedPoly) { alert('폴리 규격을 선택해주세요'); return; }
  const pcs = parseInt(document.getElementById('tPcsInput').value);
  if (!pcs || pcs <= 0) { alert('대봉당 pcs를 입력해주세요'); return; }
  if (!currentData || !currentData.sku) return;

  const tier = currentData.tier || 4;
  const otherPcs = convertPcs(pcs, tier);
  const polyRow = { sku: currentData.sku, poly_size: tSelectedPoly, category_small: currentData.category_small || '', updated_at: new Date().toISOString() };
  const bagRow = { sku: currentData.sku, category_small: currentData.category_small || '', updated_at: new Date().toISOString() };
  if (tier === 4) { bagRow.pcs_4tier = pcs; if (otherPcs) bagRow.pcs_3tier = otherPcs; }
  else { bagRow.pcs_3tier = pcs; if (otherPcs) bagRow.pcs_4tier = otherPcs; }

  try {
    await sbPost('sku_poly?on_conflict=sku', polyRow);
    await sbPost('sku_bag?on_conflict=sku', bagRow);
    // 화면 갱신
    document.getElementById('tPoly').textContent = tSelectedPoly;
    document.getElementById('tPcs').textContent = pcs;
    document.getElementById('tNewInput').style.display = 'none';
    document.getElementById('tCompleteBtn').style.display = '';
    currentData.poly = tSelectedPoly;
    currentData.pcs = pcs;
    alert('등록되었습니다');
  } catch (e) {
    console.error(e);
    alert('저장 실패: ' + e.message);
  }
}

function completeWork() {
  prevData = { ...currentData };
  isCompleted = true;
  document.getElementById('tCompleteBtn').style.display = 'none';
  document.getElementById('tUndoBtn').style.display = '';

  // 완료 배너 표시
  let banner = document.getElementById('tDoneBanner');
  if (!banner) {
    banner = document.createElement('div');
    banner.id = 'tDoneBanner';
    banner.className = 't-done-banner';
    document.getElementById('tActionArea').prepend(banner);
  }
  banner.textContent = '양품화 완료';
  banner.style.display = '';
}

function undoComplete() {
  isCompleted = false;
  const banner = document.getElementById('tDoneBanner');
  if (banner) banner.style.display = 'none';
  document.getElementById('tCompleteBtn').style.display = '';
  document.getElementById('tUndoBtn').style.display = 'none';
  alert('완료가 취소되었습니다. 이전 상태로 복구되었습니다.');
}
</script>
</body>
</html>
