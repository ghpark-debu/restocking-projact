<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>적치 정합성</title>
<style>
:root{
  --bg:#f3f4f1; --card:#ffffff; --txt:#1f2937; --sub:#6b7280; --line:#e5e7eb;
  --accent:#2563eb; --ok:#16a34a; --ng:#dc2626; --warn:#d97706;
  --shadow:0 2px 10px rgba(17,24,39,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,"Malgun Gothic",sans-serif}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);min-height:100%}
.app{max-width:520px;margin:0 auto;padding:18px 16px 28px;min-height:100vh}
.screen{display:none;animation:fade .18s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hdr{display:flex;align-items:center;gap:10px;padding:6px 4px 14px;border-bottom:1px solid var(--line);margin-bottom:18px}
.hdr h1{margin:0;font-size:22px;font-weight:800}
.back{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:8px 13px;font-size:15px;font-weight:700;box-shadow:var(--shadow)}
.menu{display:flex;flex-direction:column;gap:14px}
.mcard{display:flex;align-items:center;gap:15px;padding:18px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);cursor:pointer;transition:.12s}
.mcard:active{transform:scale(.985);background:#fafafa}
.mcard .ic{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.ic.blue{background:#e0edff}.ic.gray{background:#eceef1}
.mcard .t{font-size:18px;font-weight:800}
.mcard .d{font-size:13px;color:var(--sub);margin-top:3px}
.mcard .arw{margin-left:auto;color:#c3c7cf;font-size:24px;font-weight:400}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px;font-weight:700}
.field input{width:100%;font-size:24px;padding:15px;border-radius:15px;border:2px solid var(--line);background:var(--card);color:var(--txt);text-align:center;letter-spacing:1px;box-shadow:var(--shadow)}
.field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(37,99,235,.12)}
.scan-hidden{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}
.guide{margin-top:14px;background:var(--card);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.guide-step{font-size:16px;font-weight:800;padding:9px 0;color:var(--txt)}
.guide-step.muted{color:#c3c7cf}
.guide-step.done{color:var(--ok)}
.guide-step.active{color:var(--accent)}
#worker{font-size:17px;padding:12px}
#scan{ime-mode:disabled;-webkit-ime-mode:disabled}
.log-err{display:none;background:#fef2f2;border:1.5px solid #fecaca;color:#b91c1c;border-radius:12px;padding:11px 13px;font-size:13px;font-weight:700;margin-bottom:12px;word-break:break-all;line-height:1.5}
.lk-logerr{display:none;background:#7f1d1d;color:#fecaca;border-radius:10px;padding:9px;font-size:13px;font-weight:700;text-align:center;margin-top:10px}
.cur-loc{background:var(--card);border-radius:14px;padding:13px;text-align:center;font-size:17px;font-weight:800;box-shadow:var(--shadow);color:var(--sub);margin-bottom:12px}
.cur-loc.set{background:#e0edff;color:var(--accent)}
.flash{margin-top:14px;border-radius:20px;padding:30px 16px;text-align:center;background:var(--card);box-shadow:var(--shadow);transition:.06s}
.flash .big{font-size:46px;font-weight:900;line-height:1.05}
.flash .sub{font-size:15px;margin-top:10px;word-break:break-all}
.flash.ok{background:var(--ok);color:#fff}
.flash.ng{background:var(--ng);color:#fff}
.flash.warn{background:var(--warn);color:#fff}
.flash.idle{color:var(--sub)}
.log-title{font-size:13px;color:var(--sub);font-weight:700;margin:16px 4px 8px}
.log{font-size:14px;max-height:40vh;overflow:auto}
.log div{padding:11px 13px;border-radius:12px;margin-bottom:7px;background:var(--card);box-shadow:var(--shadow);display:flex;justify-content:space-between;gap:10px;align-items:center}
.log .loc{font-weight:800}
.log .bc{color:var(--sub);font-size:13px}
.log .tm{color:#9ca3af;font-size:11px;flex-shrink:0}
.meta{text-align:center;font-size:12px;color:var(--sub);margin-top:14px}
.lock-btn{width:100%;margin-top:14px;padding:16px;border:2px solid var(--line);border-radius:16px;background:var(--card);font-size:16px;font-weight:800;color:var(--txt);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.lock-btn:active{background:#f1f3f5}
#lockOverlay{position:fixed;inset:0;z-index:9999;background:#0f172a;color:#fff;display:none;flex-direction:column;padding:20px 18px calc(20px + env(safe-area-inset-bottom));touch-action:none;overscroll-behavior:none}
#lockOverlay.on{display:flex}
.lk-top{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:#94a3b8;font-weight:700}
.lk-dot{width:9px;height:9px;border-radius:50%;background:#22c55e;display:inline-block;margin-right:7px;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.lk-loc{margin-top:14px;padding:14px;border-radius:16px;background:#1e293b;border:1.5px solid #334155;text-align:center;font-size:22px;font-weight:900;color:#64748b;letter-spacing:.5px}
.lk-loc.set{background:#1e3a8a;border-color:#3b82f6;color:#dbeafe}
.lk-flash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:26px;margin:18px 0;background:#1e293b;transition:background .08s}
.lk-flash .lkbig{font-size:64px;font-weight:900;line-height:1}
.lk-flash .lksub{font-size:17px;margin-top:14px;opacity:.9;text-align:center;padding:0 20px;word-break:break-all}
.lk-flash.ok{background:var(--ok)}
.lk-flash.ng{background:var(--ng)}
.lk-flash.warn{background:var(--warn)}
.lk-flash.step{background:#1e293b}
.lk-recent{font-size:13px;color:#cbd5e1;text-align:center;margin-bottom:16px;min-height:18px}
.lk-slide{position:relative;height:66px;border-radius:33px;background:#1e293b;border:1.5px solid #334155;overflow:hidden;user-select:none}
.lk-slide .track{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#64748b;letter-spacing:.5px;pointer-events:none}
.lk-slide .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#2563eb;opacity:.28}
.lk-slide .knob{position:absolute;left:4px;top:4px;width:58px;height:58px;border-radius:50%;background:#f8fafc;color:#0f172a;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;box-shadow:0 3px 10px rgba(0,0,0,.35);touch-action:none}
.lk-hint{text-align:center;font-size:11px;color:#475569;margin-top:10px}
.hidden-input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
</style>
</head>
<body>
<div class="app">
  <!-- ===== 홈 ===== -->
  <section id="scHome" class="screen active">
    <div class="hdr"><h1>적치 정합성</h1></div>
    <div class="menu">
      <div class="mcard" onclick="go('Work')">
        <div class="ic blue">📥</div>
        <div><div class="t">작업 시작</div><div class="d">로케이션·상품 스캔해서 정합 확인</div></div>
        <div class="arw">›</div>
      </div>
      <div class="mcard" onclick="goBochung()">
        <div class="ic gray">📦</div>
        <div><div class="t">보충존으로</div><div class="d">재고 입고·출고·이동·덩이</div></div>
        <div class="arw">›</div>
      </div>
    </div>
  </section>
  <!-- ===== 작업 ===== -->
  <section id="scWork" class="screen">
    <div class="hdr"><button class="back" onclick="go('Home')">‹ 홈</button><h1>작업</h1></div>
    <div class="field">
      <label>작업자</label>
      <input id="worker" autocomplete="off" placeholder="작업자 이름 입력">
    </div>
    <input id="scan" class="scan-hidden" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" lang="en" inputmode="text" placeholder="바코드 스캔">
    <div class="cur-loc" id="curLocBar">로케이션 미설정</div>
    <div class="log-err" id="logErr"></div>
    <div id="flash" class="flash idle"><div class="big">대기중</div><div class="sub">로케이션부터 스캔하세요</div></div>
    <div class="guide" id="guide">
      <div class="guide-step active" id="guideStep1">1️⃣ 작업자 이름을 입력하세요</div>
      <div class="guide-step muted" id="guideStep2">2️⃣ 화면 잠금을 눌러 시작하세요</div>
    </div>
    <button class="lock-btn" onclick="lockScreen()">🔒 화면 잠금</button>
    <div class="log-title">최근 스캔 기록</div>
    <div class="log" id="log"></div>
    <div class="meta">로케이션은 다음 로케이션 스캔 전까지 유지됩니다 · 볼륨을 올려주세요</div>
  </section>
</div>
<!-- ===== 화면 잠금 오버레이 ===== -->
<div id="lockOverlay">
  <div class="lk-top"><span><span class="lk-dot"></span>스캔 대기 중</span><span id="lkWorker"></span></div>
  <div class="lk-loc" id="lkLoc">로케이션 미설정</div>
  <div id="lkFlash" class="lk-flash step"><div class="lkbig" id="lkBig">📍</div><div class="lksub" id="lkSub">로케이션을 스캔하세요</div></div>
  <div class="lk-recent" id="lkRecent"></div>
  <div class="lk-logerr" id="lkLogErr"></div>
  <div class="lk-slide" id="lkSlide">
    <div class="fill" id="lkFill"></div>
    <div class="track">밀어서 잠금 해제</div>
    <div class="knob" id="lkKnob">›</div>
  </div>
  <div class="lk-hint">스캔은 잠금 중에도 정상 동작합니다</div>
  <input id="lkInput" class="hidden-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" lang="en" inputmode="none">
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ===== 설정 =====
const SUPABASE_URL  = 'https://fdlmcaqxzzehavbpwvpu.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZkbG1jYXF4enplaGF2YnB3dnB1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0NzQxOTksImV4cCI6MjA5OTA1MDE5OX0.XMjPO1HzO6XNdoBHBZeXeJWR7iZUayTK8PXVA41gteQ';
const BARCODE_PREFIX = 'i1822';
// 보충존 앱 URL — 배포 후 채우기
const BOCHUNG_URL = 'https://stalwart-brigadeiros-cc0b9c.netlify.app/';
// ============================================
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const workerEl=document.getElementById('worker');
const scanEl=document.getElementById('scan');
const flashEl=document.getElementById('flash');
const logEl=document.getElementById('log');
const curLocBar=document.getElementById('curLocBar');
let curLoc=null, mode=null, expected=null, zoneGroup=null, expectedLabel=null;

function goBochung(){
  if(!BOCHUNG_URL||BOCHUNG_URL.indexOf('PASTE')>=0){ alert('보충존 앱 URL이 설정되지 않았습니다.'); return; }
  window.open(BOCHUNG_URL,'_blank');
}
function go(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('sc'+name).classList.add('active');
  window.scrollTo(0,0);
  if(name==='Work'){ unlockAudio(); resetScan(false); updateGuide(); workerEl.focus(); }
}
function toGroup(raw){
  const m=raw.match(/^([A-Z]*)(\d+)/i);
  if(!m) return null;
  return m[1].toUpperCase()+(Math.floor(parseInt(m[2],10)/10)*10);
}
let ac, master;
function unlockAudio(){
  try{
    ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    if(!master){ master=ac.createGain(); master.gain.value=1.0; master.connect(ac.destination); }
    if(ac.state==='suspended') ac.resume();
  }catch(e){}
}
function tone(freq,start,dur,type,vol){
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type; o.frequency.value=freq; o.connect(g); g.connect(master);
  g.gain.setValueAtTime(.0001,ac.currentTime+start);
  g.gain.exponentialRampToValueAtTime(vol,ac.currentTime+start+.01);
  g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+start+dur);
  o.start(ac.currentTime+start); o.stop(ac.currentTime+start+dur+.03);
}
function beep(type){
  unlockAudio(); if(!ac) return;
  if(type==='ok'){ tone(1046,0,.14,'sine',.9); tone(1568,.13,.22,'sine',.9); }
  else if(type==='loc'){ tone(784,0,.10,'sine',.7); tone(1046,.09,.13,'sine',.7); }
  else if(type==='warn'){ tone(520,0,.28,'triangle',.9); }
  else{ tone(180,0,.22,'square',1.0); tone(180,.26,.22,'square',1.0); tone(180,.52,.30,'square',1.0); }
  if(navigator.vibrate) navigator.vibrate(type==='ok'?80:(type==='loc'?40:[120,80,120,80,160]));
}
function setFlash(cls,big,sub){
  flashEl.className='flash '+cls;
  flashEl.innerHTML='<div class="big">'+big+'</div><div class="sub">'+sub+'</div>';
  if(locked) setLockFlash(cls,big,sub);
}
function setLockFlash(cls,big,sub){
  const f=document.getElementById('lkFlash');
  f.className='lk-flash '+(cls==='idle'?'step':cls);
  document.getElementById('lkBig').textContent=big;
  document.getElementById('lkSub').textContent=sub;
}
function addLog(loc,bc){
  const t=new Date().toTimeString().slice(0,8);
  const d=document.createElement('div');
  d.innerHTML='<span class="loc">'+loc+'</span><span class="bc">'+bc+'</span><span class="tm">'+t+'</span>';
  logEl.prepend(d);
  while(logEl.children.length>50) logEl.removeChild(logEl.lastChild);
  document.getElementById('lkRecent').textContent='직전: '+loc+' / '+bc+'  ('+t+')';
}
function resetScan(refocus){
  curLoc=null; mode=null; expected=null; zoneGroup=null;
  scanEl.value='';
  updateLocBar();
  setFlash('idle','대기중','로케이션부터 스캔하세요');
  if(refocus) scanEl.focus();
}
async function writeLog(scanLocation,optionCode,result,sku,optionName,homeLocation){
  const payload={
    user_id: workerEl.value.trim()||null,
    scan_location: scanLocation,
    scan_option: optionCode,
    mode: mode, result: result,
    expected_option: homeLocation||null,
    sku: sku||null, option_name: optionName||null
  };
  try{
    const {error}=await sb.from('putaway_logs').insert(payload);
    if(error){ showLogError(error.message||'알 수 없는 오류'); }
  }catch(e){ showLogError(e.message||'네트워크 오류'); }
}
function showLogError(msg){
  const bar=document.getElementById('logErr');
  if(bar){ bar.style.display='block'; bar.textContent='⚠ 로그 저장 실패: '+msg; }
  const lk=document.getElementById('lkLogErr');
  if(lk&&locked){ lk.style.display='block'; lk.textContent='⚠ 로그 저장 실패'; }
}
scanEl.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); routeScan(scanEl.value); scanEl.value=''; } });
async function routeScan(raw){
  const v=String(raw).trim();
  if(!v) return;
  if(v.toUpperCase().startsWith(BARCODE_PREFIX.toUpperCase())){ await handleProduct(v); }
  else{ await handleLocation(v); }
}
async function handleLocation(raw){
  const v=raw.toUpperCase();
  if(v.includes('-')){
    setFlash('idle','조회중…','로케이션 확인');
    const {data,error}=await sb.from('putaway_locations').select('option_code,sku,option_name').eq('location',v).maybeSingle();
    if(error){ setFlash('warn','통신오류','다시 시도'); beep('warn'); return; }
    if(!data){
      curLoc=null; mode=null; expected=null; zoneGroup=null;
      updateLocBar();
      setFlash('warn','로케이션 없음','미등록: '+v); beep('warn'); return;
    }
    curLoc=v; mode='full'; expected=data.option_code; zoneGroup=null;
    expectedLabel=data.option_name||data.sku||data.option_code;
  }else{
    const g=toGroup(v);
    if(!g){
      curLoc=null; mode=null; expected=null; zoneGroup=null;
      updateLocBar();
      setFlash('warn','형식오류','로케이션 확인: '+v); beep('warn'); return;
    }
    curLoc=v; mode='zone'; expected=null; zoneGroup=g; expectedLabel=null;
  }
  updateLocBar();
  beep('loc');
  setFlash('idle',curLoc,expectedLabel?'지정: '+expectedLabel:'상품을 스캔하세요');
}
async function handleProduct(raw){
  if(!curLoc||!mode){ setFlash('warn','로케이션 먼저','로케이션을 먼저 스캔'); beep('warn'); return; }
  const bcUpper=raw.toUpperCase();
  const prefixUpper=BARCODE_PREFIX.toUpperCase();
  const opt=bcUpper.startsWith(prefixUpper)?bcUpper.slice(prefixUpper.length):bcUpper;
  const {data:rows,error}=await sb.from('putaway_locations').select('location,group_key,sku,option_name').eq('option_code',opt);
  if(error){ setFlash('warn','통신오류','다시 시도'); beep('warn'); return; }
  const info=(rows&&rows.length)?rows[0]:null;
  const sku=info?info.sku:null;
  const optName=info?info.option_name:null;
  const homeLocs=rows?rows.map(r=>r.location):[];
  const homeStr=homeLocs.length?homeLocs.slice(0,3).join(', ')+(homeLocs.length>3?' 외 '+(homeLocs.length-3)+'곳':''):null;
  let ok=false;
  if(mode==='full'){ ok=homeLocs.indexOf(curLoc)>=0; }
  else{ ok=rows?rows.some(r=>r.group_key===zoneGroup):false; }
  const label=optName?optName:(sku?sku:opt);
  if(ok){ setFlash('ok','정상',curLoc+' · '+label); beep('ok'); }
  else{ setFlash('ng','오적치',(homeStr?'정상위치: '+homeStr:'미등록 상품')+' · '+label); beep('ng'); }
  addLog(curLoc,label);
  writeLog(curLoc,opt,ok?'ok':'ng',sku,optName,homeStr);
}
function updateLocBar(){
  if(curLoc){
    curLocBar.className='cur-loc set';
    curLocBar.textContent='📍 '+curLoc+(mode==='zone'?' (존 '+zoneGroup+')':'');
  }else{
    curLocBar.className='cur-loc';
    curLocBar.textContent='로케이션 미설정';
  }
  if(locked) updateLockLocBar();
}
function updateGuide(){
  const has=workerEl.value.trim().length>0;
  const s1=document.getElementById('guideStep1');
  const s2=document.getElementById('guideStep2');
  if(!s1||!s2) return;
  if(has){
    s1.className='guide-step done'; s1.textContent='✅ 작업자: '+workerEl.value.trim();
    s2.className='guide-step active'; s2.textContent='2️⃣ 화면 잠금을 눌러 시작하세요';
  }else{
    s1.className='guide-step active'; s1.textContent='1️⃣ 작업자 이름을 입력하세요';
    s2.className='guide-step muted'; s2.textContent='2️⃣ 화면 잠금을 눌러 시작하세요';
  }
}
workerEl.addEventListener('input',updateGuide);
updateGuide();
document.body.addEventListener('click',unlockAudio);
// ===== 화면 잠금 =====
let locked=false, focusTimer=null, wakeLock=null;
const ovl=document.getElementById('lockOverlay');
const lkIn=document.getElementById('lkInput');
const lkKnob=document.getElementById('lkKnob');
const lkFill=document.getElementById('lkFill');
const lkSlide=document.getElementById('lkSlide');
function lockScreen(){
  if(!workerEl.value.trim()){ setFlash('warn','작업자 입력','이름을 먼저 입력하세요'); beep('warn'); updateGuide(); workerEl.focus(); return; }
  unlockAudio(); locked=true; ovl.classList.add('on');
  document.getElementById('lkWorker').textContent=workerEl.value.trim();
  resetLockUI(); startFocusGuard(); requestWakeLock();
  history.pushState(null,'',location.href);
}
function unlockScreen(){ locked=false; ovl.classList.remove('on'); stopFocusGuard(); releaseWakeLock(); resetKnob(); scanEl.focus(); }
async function requestWakeLock(){
  try{ if('wakeLock' in navigator){ wakeLock=await navigator.wakeLock.request('screen'); } }catch(e){}
}
function releaseWakeLock(){ try{ if(wakeLock){ wakeLock.release(); wakeLock=null; } }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(locked&&document.visibilityState==='visible'){ requestWakeLock(); lkIn.focus(); } });
function startFocusGuard(){
  lkIn.value=''; lkIn.focus();
  focusTimer=setInterval(()=>{ if(locked&&document.activeElement!==lkIn) lkIn.focus(); },400);
}
function stopFocusGuard(){ if(focusTimer){ clearInterval(focusTimer); focusTimer=null; } lkIn.blur(); lkIn.value=''; }
function resetLockUI(){
  updateLockLocBar();
  if(curLoc) setLockFlash('step','📦','상품을 스캔하세요');
  else setLockFlash('step','📍','로케이션을 스캔하세요');
}
function updateLockLocBar(){
  const el=document.getElementById('lkLoc');
  if(!el) return;
  if(curLoc){ el.className='lk-loc set'; el.textContent='📍 '+curLoc+(mode==='zone'?'  (존 '+zoneGroup+')':''); }
  else{ el.className='lk-loc'; el.textContent='로케이션 미설정'; }
}
lkIn.addEventListener('keydown',async e=>{
  if(e.key!=='Enter') return;
  e.preventDefault();
  const v=lkIn.value.trim(); lkIn.value='';
  if(!v) return;
  await routeScan(v);
});
ovl.addEventListener('touchstart',e=>{ if(!lkSlide.contains(e.target)) e.preventDefault(); },{passive:false});
ovl.addEventListener('click',e=>{ if(!lkSlide.contains(e.target)){ e.preventDefault(); e.stopPropagation(); } },true);
let dragging=false, startX=0, maxX=0;
function resetKnob(){ lkKnob.style.left='4px'; lkFill.style.width='0'; }
function onDragStart(clientX){ dragging=true; startX=clientX; maxX=lkSlide.clientWidth-lkKnob.clientWidth-8; }
function onDragMove(clientX){
  if(!dragging) return;
  let dx=clientX-startX;
  if(dx<0) dx=0; if(dx>maxX) dx=maxX;
  lkKnob.style.left=(4+dx)+'px'; lkFill.style.width=(dx+58)+'px';
}
function onDragEnd(){
  if(!dragging) return; dragging=false;
  const cur=parseFloat(lkKnob.style.left)-4;
  if(cur>=maxX*0.9){ if(navigator.vibrate) navigator.vibrate(60); unlockScreen(); }
  else{ lkKnob.style.transition='left .18s'; lkFill.style.transition='width .18s'; resetKnob(); setTimeout(()=>{ lkKnob.style.transition=''; lkFill.style.transition=''; },200); }
}
lkKnob.addEventListener('touchstart',e=>{ e.preventDefault(); onDragStart(e.touches[0].clientX); },{passive:false});
lkKnob.addEventListener('touchmove', e=>{ e.preventDefault(); onDragMove(e.touches[0].clientX); },{passive:false});
lkKnob.addEventListener('touchend',  e=>{ e.preventDefault(); onDragEnd(); },{passive:false});
lkKnob.addEventListener('mousedown', e=>{ e.preventDefault(); onDragStart(e.clientX); });
document.addEventListener('mousemove',e=>{ if(dragging) onDragMove(e.clientX); });
document.addEventListener('mouseup',  ()=>{ if(dragging) onDragEnd(); });
window.addEventListener('popstate',()=>{ if(locked) history.pushState(null,'',location.href); });
</script>
</body>
</html>
