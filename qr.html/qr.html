<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소테이블 QR코드 생성</title>
<style>
  :root { --apple-blue:#007AFF; --apple-gray5:#E5E5EA; --apple-gray6:#F2F2F7; --apple-text:#1C1C1E; --apple-text-sub:#8E8E93; --apple-bg:#F2F2F7; --apple-card:#FFFFFF; --apple-shadow:0 1px 3px rgba(0,0,0,0.06),0 2px 8px rgba(0,0,0,0.04); --apple-radius:12px; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,'Helvetica Neue',sans-serif; background:var(--apple-bg); color:var(--apple-text); padding:20px; -webkit-font-smoothing:antialiased; }
  h1 { font-size:22px; font-weight:700; letter-spacing:-0.3px; margin-bottom:4px; }
  .desc { font-size:14px; color:var(--apple-text-sub); margin-bottom:20px; }
  .setup { background:var(--apple-card); border:none; border-radius:16px; padding:20px; margin-bottom:20px; box-shadow:var(--apple-shadow); }
  .setup label { font-size:13px; font-weight:600; display:block; margin-bottom:6px; color:var(--apple-text-sub); text-transform:uppercase; letter-spacing:0.3px; }
  .hint { font-size:12px; color:var(--apple-text-sub); margin-top:-4px; margin-bottom:12px; }
  .btn-row { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  .btn-opt { padding:10px 16px; border:none; border-radius:var(--apple-radius); background:var(--apple-gray6); font-size:14px; font-weight:600; color:var(--apple-text-sub); cursor:pointer; transition:all 0.2s; }
  .btn-opt.active { background:var(--apple-blue); color:#fff; }
  .btn-opt:active { transform:scale(0.96); }
  .btn-gen { width:100%; padding:14px; font-size:16px; font-weight:600; background:var(--apple-blue); color:#fff; border:none; border-radius:var(--apple-radius); cursor:pointer; margin-bottom:8px; transition:all 0.2s; }
  .btn-gen:active { transform:scale(0.98); }
  .btn-print { width:100%; padding:14px; font-size:15px; font-weight:600; background:var(--apple-card); color:var(--apple-blue); border:none; border-radius:var(--apple-radius); cursor:pointer; box-shadow:var(--apple-shadow); }
  .qr-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:12px; }
  .qr-card { background:var(--apple-card); border:none; border-radius:16px; padding:16px; text-align:center; box-shadow:var(--apple-shadow); }
  .qr-label { font-size:18px; font-weight:700; margin-bottom:10px; letter-spacing:-0.2px; }
  .qr-img { margin-bottom:8px; border-radius:8px; }
  .qr-url { display:none !important; }
  @media print {
    body { padding:0; background:#fff; }
    .setup, h1, .desc { display:none !important; }
    .qr-grid { grid-template-columns:repeat(4, 1fr); gap:8px; }
    .qr-card { box-shadow:none; border:1px solid #ddd; padding:8px; page-break-inside:avoid; }
    .qr-label { font-size:14px; }
  }
</style>
</head>
<body>

<h1>소테이블 QR코드 생성</h1>
<p class="desc">각 소테이블에 붙일 QR코드를 생성합니다. 인쇄해서 소테이블에 부착하세요.</p>

<div class="setup">
  <label>층 선택</label>
  <div class="btn-row" id="floorRow"></div>

  <label>대테이블 선택</label>
  <div class="btn-row" id="tableRow"></div>

  <button class="btn-gen" onclick="generateQRs()">QR코드 생성</button>
  <button class="btn-print" id="printBtn" style="display:none;" onclick="window.print()">🖨 인쇄하기</button>
</div>

<div class="qr-grid" id="qrGrid"></div>

<script>
// ★ GitHub Pages 소테이블 URL
const BASE_URL = 'https://ghpark-debu.github.io/restocking-projact/table.html';
const TABLES = [1, 2, 3, 4, 5, 6, 7];
const SUB_COUNT = 8;

let selectedFloor = '3층';
let selectedTable = null; // null = 전체

// 층 버튼 생성
function renderFloorBtns() {
  const row = document.getElementById('floorRow');
  ['3층', '2층'].forEach(f => {
    const btn = document.createElement('button');
    btn.className = 'btn-opt' + (f === selectedFloor ? ' active' : '');
    btn.textContent = f;
    btn.onclick = () => { selectedFloor = f; refreshBtns(); };
    row.appendChild(btn);
  });
}

// 테이블 버튼 생성
function renderTableBtns() {
  const row = document.getElementById('tableRow');
  row.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.className = 'btn-opt' + (selectedTable === null ? ' active' : '');
  allBtn.textContent = '전체';
  allBtn.onclick = () => { selectedTable = null; refreshBtns(); };
  row.appendChild(allBtn);
  TABLES.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'btn-opt' + (selectedTable === t ? ' active' : '');
    btn.textContent = t + '번';
    btn.onclick = () => { selectedTable = t; refreshBtns(); };
    row.appendChild(btn);
  });
}

function refreshBtns() {
  document.getElementById('floorRow').innerHTML = '';
  renderFloorBtns();
  renderTableBtns();
}

function generateQRs() {
  const tables = selectedTable ? [selectedTable] : TABLES;
  const grid = document.getElementById('qrGrid');
  grid.innerHTML = '';

  tables.forEach(t => {
    for (let s = 1; s <= SUB_COUNT; s++) {
      const subId = selectedFloor + '-' + t + '-' + s;
      const url = BASE_URL + '?t=' + encodeURIComponent(subId);

      const card = document.createElement('div');
      card.className = 'qr-card';

      const label = document.createElement('div');
      label.className = 'qr-label';
      label.textContent = subId;
      card.appendChild(label);

      const img = document.createElement('img');
      img.className = 'qr-img';
      img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=' + encodeURIComponent(url) + '&margin=4';
      img.width = 150;
      img.height = 150;
      img.alt = subId;
      card.appendChild(img);

      const urlDiv = document.createElement('div');
      urlDiv.className = 'qr-url';
      urlDiv.textContent = url;
      card.appendChild(urlDiv);

      grid.appendChild(card);
    }
  });

  document.getElementById('printBtn').style.display = '';
}

// 초기화
renderFloorBtns();
renderTableBtns();
</script>
</body>
</html>
