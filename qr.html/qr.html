<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소테이블 QR코드 생성</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#f5f5f7; color:#1a1a1a; padding:20px; }
  h1 { font-size:20px; margin-bottom:4px; }
  .desc { font-size:14px; color:#6b7280; margin-bottom:20px; }
  .setup { background:#fff; border:1px solid #e2e2e6; border-radius:12px; padding:20px; margin-bottom:20px; }
  .setup label { font-size:14px; font-weight:600; display:block; margin-bottom:6px; }
  .hint { font-size:12px; color:#6b7280; margin-top:-4px; margin-bottom:12px; }
  .btn-row { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  .btn-opt { padding:10px 16px; border:1.5px solid #e2e2e6; border-radius:10px; background:#fff; font-size:14px; font-weight:600; color:#6b7280; cursor:pointer; }
  .btn-opt.active { border-color:#2563eb; color:#2563eb; background:#eef2ff; }
  .btn-gen { width:100%; padding:14px; font-size:15px; font-weight:600; background:#2563eb; color:#fff; border:none; border-radius:10px; cursor:pointer; margin-bottom:8px; }
  .btn-print { width:100%; padding:14px; font-size:15px; font-weight:600; background:#fff; color:#2563eb; border:1.5px solid #2563eb; border-radius:10px; cursor:pointer; }
  .qr-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:12px; }
  .qr-card { background:#fff; border:1px solid #e2e2e6; border-radius:12px; padding:16px; text-align:center; }
  .qr-label { font-size:18px; font-weight:700; margin-bottom:10px; }
  .qr-img { margin-bottom:8px; }
  .qr-url { font-size:9px; color:#9ca3af; word-break:break-all; line-height:1.3; }
  @media print {
    body { padding:0; background:#fff; }
    .setup, h1, .desc { display:none !important; }
    .qr-grid { grid-template-columns:repeat(4, 1fr); gap:8px; }
    .qr-card { border:1px solid #ccc; padding:8px; page-break-inside:avoid; }
    .qr-label { font-size:14px; }
  }
</style>
</head>
<body>

<h1>소테이블 QR코드 생성</h1>
<p class="desc">각 소테이블에 붙일 QR코드를 생성합니다. 인쇄해서 소테이블에 부착하세요.</p>

<div class="setup">
  <label>층 선택</label>
  <div class="btn-row" id="floorRow"></div>

  <label>대테이블 선택</label>
  <div class="btn-row" id="tableRow"></div>

  <button class="btn-gen" onclick="generateQRs()">QR코드 생성</button>
  <button class="btn-print" id="printBtn" style="display:none;" onclick="window.print()">🖨 인쇄하기</button>
</div>

<div class="qr-grid" id="qrGrid"></div>

<script>
// ★ GitHub Pages 소테이블 URL
const BASE_URL = 'https://ghpark-debu.github.io/restocking-projact/table.html';
const TABLES = [1, 2, 3, 4, 5, 6, 7];
const SUB_COUNT = 8;

let selectedFloor = '3층';
let selectedTable = null; // null = 전체

// 층 버튼 생성
function renderFloorBtns() {
  const row = document.getElementById('floorRow');
  ['3층', '2층'].forEach(f => {
    const btn = document.createElement('button');
    btn.className = 'btn-opt' + (f === selectedFloor ? ' active' : '');
    btn.textContent = f;
    btn.onclick = () => { selectedFloor = f; refreshBtns(); };
    row.appendChild(btn);
  });
}

// 테이블 버튼 생성
function renderTableBtns() {
  const row = document.getElementById('tableRow');
  row.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.className = 'btn-opt' + (selectedTable === null ? ' active' : '');
  allBtn.textContent = '전체';
  allBtn.onclick = () => { selectedTable = null; refreshBtns(); };
  row.appendChild(allBtn);
  TABLES.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'btn-opt' + (selectedTable === t ? ' active' : '');
    btn.textContent = t + '번';
    btn.onclick = () => { selectedTable = t; refreshBtns(); };
    row.appendChild(btn);
  });
}

function refreshBtns() {
  document.getElementById('floorRow').innerHTML = '';
  renderFloorBtns();
  renderTableBtns();
}

function generateQRs() {
  const tables = selectedTable ? [selectedTable] : TABLES;
  const grid = document.getElementById('qrGrid');
  grid.innerHTML = '';

  tables.forEach(t => {
    for (let s = 1; s <= SUB_COUNT; s++) {
      const subId = selectedFloor + '-' + t + '-' + s;
      const url = BASE_URL + '?t=' + encodeURIComponent(subId);

      const card = document.createElement('div');
      card.className = 'qr-card';

      const label = document.createElement('div');
      label.className = 'qr-label';
      label.textContent = subId;
      card.appendChild(label);

      const img = document.createElement('img');
      img.className = 'qr-img';
      img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=' + encodeURIComponent(url) + '&margin=4';
      img.width = 150;
      img.height = 150;
      img.alt = subId;
      card.appendChild(img);

      const urlDiv = document.createElement('div');
      urlDiv.className = 'qr-url';
      urlDiv.textContent = url;
      card.appendChild(urlDiv);

      grid.appendChild(card);
    }
  });

  document.getElementById('printBtn').style.display = '';
}

// 초기화
renderFloorBtns();
renderTableBtns();
</script>
</body>
</html>
