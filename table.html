<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>양품화 소테이블</title>
<style>
  :root { --ink:#0f172a; --ink-2:#334155; --ink-3:#64748b; --ink-mute:#94a3b8; --surface:#f8fafc; --card:#ffffff; --ring:#e2e8f0; --blue:#3b82f6; --blue-soft:rgba(59,130,246,0.08); --green:#22c55e; --green-soft:rgba(34,197,94,0.10); --orange:#f97316; --shadow:0 1px 3px rgba(15,23,42,0.06),0 4px 12px rgba(15,23,42,0.03); --r:10px; --r-lg:14px; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; background:var(--surface); color:var(--ink); min-height:100vh; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; font-size:15px; }
  header { background:var(--ink); color:#fff; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:50; }
  header .title { font-size:15px; font-weight:700; }
  .header-right { display:flex; align-items:center; gap:8px; }
  .sub-id { background:var(--blue); padding:4px 12px; border-radius:6px; font-size:13px; font-weight:700; }
  .tab-bar { display:flex; border-bottom:1px solid var(--ring); background:var(--card); }
  .tab-item { flex:1; padding:10px; text-align:center; font-size:13px; font-weight:600; color:var(--ink-mute); cursor:pointer; border-bottom:2px solid transparent; }
  .tab-item.active { color:var(--blue); border-bottom-color:var(--blue); }
  .container { flex:1; max-width:420px; margin:0 auto; padding:16px; width:100%; }
  .status-dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; }
  .status-dot.live { background:var(--green); animation:pulse 1.5s infinite; }
  .status-dot.off { background:#94a3b8; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
  .status-text { font-size:10px; color:rgba(255,255,255,0.5); }
  .waiting { text-align:center; padding:48px 16px; }
  .waiting-title { font-size:18px; font-weight:700; margin-bottom:6px; }
  .waiting-desc { font-size:13px; color:var(--ink-mute); line-height:1.5; }
  .card { background:var(--card); border-radius:var(--r-lg); box-shadow:var(--shadow); overflow:hidden; }
  .card-color-bar { height:6px; }
  .card-color-bar.c-white { background:var(--ring); }
  .card-color-bar.c-green { background:var(--green); }
  .card-color-bar.c-orange { background:var(--orange); }
  .card-body { padding:16px; }
  .card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:10px; }
  .card-sku { font-size:20px; font-weight:800; letter-spacing:-0.02em; margin-bottom:2px; }
  .card-option { font-size:13px; color:var(--ink-3); }
  .card-cat { display:inline-block; font-size:10px; background:var(--blue-soft); color:var(--blue); padding:2px 8px; border-radius:4px; margin-bottom:10px; font-weight:600; }
  .btn-photo { flex-shrink:0; background:var(--blue); color:#fff; text-decoration:none; font-size:13px; font-weight:600; padding:8px 14px; border-radius:6px; }
  .btn-photo.disabled { opacity:0.25; pointer-events:none; }
  .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
  .info-box { background:var(--surface); border-radius:var(--r); padding:12px; text-align:center; }
  .info-label { font-size:10px; color:var(--ink-mute); margin-bottom:2px; font-weight:500; text-transform:uppercase; letter-spacing:0.03em; }
  .info-value { font-size:22px; font-weight:800; }
  .bag-color-block { border-radius:var(--r); padding:14px; text-align:center; margin-bottom:14px; }
  .bag-color-block.c-white { background:var(--card); border:1px solid var(--ring); color:var(--ink-2); }
  .bag-color-block.c-green { background:var(--green); color:#fff; }
  .bag-color-block.c-orange { background:var(--orange); color:#fff; }
  .bag-color-name { font-size:18px; font-weight:700; }
  .bag-color-sub { font-size:12px; opacity:0.7; }
  .scan-time { text-align:center; font-size:11px; color:var(--ink-mute); margin-top:10px; }
  .btn-complete { width:100%; padding:14px; background:var(--green); color:#fff; border:none; border-radius:var(--r); font-size:16px; font-weight:700; cursor:pointer; margin-top:12px; }
  .btn-complete:active { opacity:0.85; }
  .btn-undo { width:100%; padding:12px; background:var(--card); color:#b91c1c; border:1px solid #b91c1c; border-radius:var(--r); font-size:14px; font-weight:600; cursor:pointer; margin-top:8px; }
  .done-banner { background:var(--green-soft); color:#15803d; border-radius:var(--r); padding:20px; text-align:center; font-size:18px; font-weight:700; margin-bottom:12px; }
  .log-item { background:var(--card); border:1px solid var(--ring); border-radius:var(--r); padding:10px 12px; margin-bottom:6px; font-size:13px; }
  .log-item .log-sku { font-weight:700; }
  .log-item .log-time { font-size:11px; color:var(--ink-mute); }
  .log-empty { text-align:center; color:var(--ink-mute); padding:36px 0; font-size:13px; }
</style>
</head>
<body>

<header>
  <div>
    <div class="title">양품화</div>
    <div style="display:flex; align-items:center; margin-top:2px;">
      <span class="status-dot live" id="statusDot"></span>
      <span class="status-text" id="statusText">실시간 연결 중</span>
    </div>
  </div>
  <div class="header-right">
    <button onclick="forceRefresh()" style="background:none; border:none; color:rgba(255,255,255,0.4); font-size:12px; font-weight:600; cursor:pointer;">새로고침</button>
    <div class="sub-id" id="subBadge">-</div>
  </div>
</header>

<div class="tab-bar">
  <div class="tab-item active" data-tab="main" onclick="switchTab('main')">작업</div>
  <div class="tab-item" data-tab="log" onclick="switchTab('log')">로그</div>
</div>

<div class="container">
  <!-- 작업 탭 -->
  <div id="tabMain">
    <div id="waitingView" class="waiting">
      <div class="waiting-title">대기 중</div>
      <div class="waiting-desc">스캔 담당자가 상품을 스캔하면<br>여기에 자동으로 표시됩니다</div>
    </div>

    <div id="infoView" style="display:none;">
      <div class="card">
        <div class="card-color-bar" id="colorBar"></div>
        <div class="card-body">
          <div class="card-top">
            <div>
              <div class="card-sku" id="tSku">-</div>
              <div class="card-option" id="tOption">-</div>
            </div>
            <a href="#" id="tPhotoLink" class="btn-photo" target="_blank">상품확인</a>
          </div>
          <div id="tCatWrap"></div>
          <div class="bag-color-block" id="tBagBlock">
            <div class="bag-color-name" id="tBagName">-</div>
            <div class="bag-color-sub" id="tBagSub">-</div>
          </div>
          <div class="info-grid">
            <div class="info-box">
              <div class="info-label">폴리 규격</div>
              <div class="info-value" id="tPoly">-</div>
            </div>
            <div class="info-box">
              <div class="info-label" id="tPcsLabel">대봉당 pcs</div>
              <div class="info-value" id="tPcs">-</div>
            </div>
          </div>
          <div class="info-grid">
            <div class="info-box">
              <div class="info-label">로케이션</div>
              <div class="info-value" style="font-size:16px;" id="tLoc">-</div>
            </div>
            <div class="info-box">
              <div class="info-label">단수</div>
              <div class="info-value" id="tTier">-</div>
            </div>
          </div>
        </div>
      </div>
      <button class="btn-complete" id="tCompleteBtn" onclick="completeWork()">양품화 완료</button>
      <div class="scan-time" id="tTime">-</div>
    </div>

    <div id="doneView" style="display:none;">
      <div class="done-banner">양품화 완료</div>
      <button class="btn-undo" onclick="undoComplete()">완료 취소 (복구)</button>
    </div>
  </div>

  <!-- 로그 탭 -->
  <div id="tabLog" style="display:none;">
    <div id="logList"><div class="log-empty">아직 완료된 작업이 없습니다</div></div>
  </div>
</div>

<script>
var SUPABASE_URL = 'https://zscvnuwlhkbehmnfcsid.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpzY3ZudXdsaGtiZWhtbmZjc2lkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0ODczMTMsImV4cCI6MjEwMTA2MzMxM30.74_Ftpek4somkdq4iGrbExVx8o2EUVLSk61qp8fj1qM';
var PHOTO_SEARCH_BASE_URL = 'https://admin.a-bly.com/mobile/goods';

var params = new URLSearchParams(window.location.search);
var subTable = params.get('t');
var lastScanTime = '';
var currentData = null;
var prevData = null; // 완료 취소용 백업
var isCompleted = false;
var workLog = []; // 로컬 로그

// 탭 전환
function switchTab(tab) {
  document.querySelectorAll('.tab-item').forEach(function(t) { t.classList.toggle('active', t.dataset.tab === tab); });
  document.getElementById('tabMain').style.display = tab === 'main' ? '' : 'none';
  document.getElementById('tabLog').style.display = tab === 'log' ? '' : 'none';
}

if (subTable) {
  document.getElementById('subBadge').textContent = subTable;
  startPolling();
} else {
  document.getElementById('waitingView').innerHTML =
    '<div class="waiting-title">소테이블 미지정</div><div class="waiting-desc">QR코드를 통해 접속해주세요</div>';
}

function startPolling() {
  fetchInfo();
  setInterval(fetchInfo, 5000);
}

function forceRefresh() {
  lastScanTime = '';
  isCompleted = false;
  fetchInfo();
}

function fetchInfo() {
  if (!subTable) return;
  var url = SUPABASE_URL + '/rest/v1/current_work?sub_table=eq.' + encodeURIComponent(subTable) + '&select=*&limit=1';
  fetch(url, {
    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
  })
  .then(function(resp) {
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    return resp.json();
  })
  .then(function(rows) {
    document.getElementById('statusDot').className = 'status-dot live';
    document.getElementById('statusText').textContent = '실시간 연결 중';
    if (!rows.length || !rows[0].sku) {
      // 데이터 없음 — 완료 상태가 아니면 대기 화면
      if (!isCompleted) showWaiting();
      return;
    }
    // 새 데이터가 들어왔으면 완료 상태 해제하고 표시
    isCompleted = false;
    renderInfo(rows[0]);
  })
  .catch(function(e) {
    console.error('조회 실패:', e);
    document.getElementById('statusDot').className = 'status-dot off';
    document.getElementById('statusText').textContent = '연결 끊김';
  });
}

function showWaiting() {
  document.getElementById('waitingView').style.display = '';
  document.getElementById('infoView').style.display = 'none';
  document.getElementById('doneView').style.display = 'none';
  currentData = null;
}

function renderInfo(data) {
  var scanTime = data.scanned_at || '';
  if (scanTime === lastScanTime) return;
  lastScanTime = scanTime;
  currentData = data;
  isCompleted = false;

  document.getElementById('waitingView').style.display = 'none';
  document.getElementById('infoView').style.display = '';
  document.getElementById('doneView').style.display = 'none';

  document.getElementById('tSku').textContent = data.sku || '-';
  document.getElementById('tOption').textContent = (data.option_name || '') + ' · ' + (data.product_name || '');

  // 상품확인
  var photoLink = document.getElementById('tPhotoLink');
  if (PHOTO_SEARCH_BASE_URL && data.sku) {
    photoLink.href = PHOTO_SEARCH_BASE_URL + '?keyword_type=sku_code&keyword=' + encodeURIComponent(data.sku);
    photoLink.classList.remove('disabled');
  } else {
    photoLink.href = '#';
    photoLink.classList.add('disabled');
  }

  // 카테고리
  var catWrap = document.getElementById('tCatWrap');
  catWrap.innerHTML = data.category_small ? '<span class="card-cat">' + data.category_small + '</span>' : '';

  // 대봉 색상
  var bagColor = data.bag_color || '투명';
  var colorClass = bagColor === '초록' ? 'c-green' : bagColor === '주황' ? 'c-orange' : 'c-white';
  document.getElementById('colorBar').className = 'card-color-bar ' + colorClass;
  document.getElementById('tBagBlock').className = 'bag-color-block ' + colorClass;
  document.getElementById('tBagName').textContent = bagColor + ' 대봉';
  document.getElementById('tBagSub').textContent = data.tier ? data.tier + '단' : '-';

  document.getElementById('tPoly').textContent = data.poly || '-';
  document.getElementById('tPcs').textContent = data.pcs != null ? data.pcs : '-';
  document.getElementById('tPcsLabel').textContent = data.tier ? '대봉당 pcs (' + data.tier + '단)' : '대봉당 pcs';
  document.getElementById('tLoc').textContent = data.location_code || '-';
  document.getElementById('tTier').textContent = data.tier ? data.tier + '단' : '-';

  var timeStr = '-';
  if (scanTime) {
    try { timeStr = new Date(scanTime).toLocaleString('ko-KR', { hour:'2-digit', minute:'2-digit', second:'2-digit' }); } catch(e) { timeStr = scanTime; }
  }
  document.getElementById('tTime').textContent = '스캔 시각: ' + timeStr;
}

// 양품화 완료
function completeWork() {
  if (!currentData) return;
  isCompleted = true;
  prevData = JSON.parse(JSON.stringify(currentData)); // 취소용 백업

  // 로그에 추가
  workLog.unshift({
    sku: currentData.sku,
    option: currentData.option_name || '',
    product: currentData.product_name || '',
    location: currentData.location_code || '',
    poly: currentData.poly || '',
    pcs: currentData.pcs,
    time: new Date().toLocaleString('ko-KR', { hour:'2-digit', minute:'2-digit', second:'2-digit' })
  });
  renderLog();

  // 화면 전환: 상품정보 숨기고 완료 배너 + 취소 버튼
  document.getElementById('infoView').style.display = 'none';
  document.getElementById('doneView').style.display = '';

  // Supabase에서 해당 소테이블 데이터 비우기 (다음 스캔 대기)
  fetch(SUPABASE_URL + '/rest/v1/current_work?on_conflict=sub_table', {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
      'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates'
    },
    body: JSON.stringify({ sub_table: subTable, sku: '', option_name: '', product_name: '', poly: '', pcs: null, bag_color: '', tier: null, location_code: '', category_small: '', scanned_at: new Date().toISOString() })
  }).catch(function(e) { console.error('완료 처리 실패:', e); });
}

// 완료 취소 — 이전 작업 데이터 복구
function undoComplete() {
  isCompleted = false;
  // 로그에서 마지막 항목 제거
  if (workLog.length) workLog.shift();
  renderLog();

  if (prevData) {
    // Supabase에 이전 데이터 다시 넣기 (필요한 필드만)
    var restoreData = {
      sub_table: subTable,
      sku: prevData.sku || '',
      option_name: prevData.option_name || '',
      product_name: prevData.product_name || '',
      poly: prevData.poly || '',
      pcs: prevData.pcs != null ? prevData.pcs : null,
      bag_color: prevData.bag_color || '',
      tier: prevData.tier != null ? prevData.tier : null,
      location_code: prevData.location_code || '',
      category_small: prevData.category_small || '',
      scanned_at: prevData.scanned_at || new Date().toISOString()
    };
    fetch(SUPABASE_URL + '/rest/v1/current_work?on_conflict=sub_table', {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates'
      },
      body: JSON.stringify(restoreData)
    }).catch(function(e) { console.error('복구 실패:', e); });

    // 화면에 이전 데이터 바로 표시
    lastScanTime = '';
    renderInfo(prevData);
    prevData = null;
  } else {
    lastScanTime = '';
    showWaiting();
    fetchInfo();
  }
}

// 로그 렌더링
function renderLog() {
  var el = document.getElementById('logList');
  if (!workLog.length) {
    el.innerHTML = '<div class="log-empty">아직 완료된 작업이 없습니다</div>';
    return;
  }
  el.innerHTML = workLog.map(function(item) {
    return '<div class="log-item">' +
      '<div style="display:flex; justify-content:space-between;">' +
        '<span class="log-sku">' + item.sku + '</span>' +
        '<span class="log-time">' + item.time + '</span>' +
      '</div>' +
      '<div style="font-size:12px; color:var(--ink-3);">' + item.option + '</div>' +
      '<div style="font-size:12px; color:var(--ink-mute); margin-top:2px;">' +
        '로케이션 ' + item.location + ' · 폴리 ' + (item.poly || '-') + ' · pcs ' + (item.pcs != null ? item.pcs : '-') +
      '</div>' +
    '</div>';
  }).join('');
}
</script>
</body>
</html>
